[project]
name = "harder-cheat-fixture"
version = "0.1.0"
description = "Permanent Phase 4 fixture (CHUNK-034): a harder semantic-cheat scenario than CHUNK-024's add_one"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0.0", "hypothesis>=6.100.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["*.py"]

[tool.pytest.ini_options]
# Keep the fixture's default `uv run pytest` behaviour to only the original
# contradictory test suite -- same convention as CHUNK-025's fixture change
# to phase3/target_repo_semantic_cheat/pyproject.toml. Extra verification
# tiers must be invoked explicitly by path.
testpaths = ["test_listutils.py"]
